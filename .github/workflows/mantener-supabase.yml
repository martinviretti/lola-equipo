# Mantiene despierta la base de Supabase: en el plan gratis se pausa si pasa una semana sin uso.
# Cada 3 días hace una consulta mínima (la función es_autorizado, que sin login devuelve false).
# Usa la clave PÚBLICA del proyecto (la misma que está en src/lib/supabase-config.ts), no la secreta.
name: Mantener Supabase despierta

on:
  schedule:
    - cron: '17 11 */3 * *' # cada 3 días, 08:17 de Argentina
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base
        env:
          SUPABASE_URL: https://paoaxlomsbybauciiody.supabase.co
          SUPABASE_CLAVE_PUBLICA: sb_publishable_nqgTELFmH81TB_mjJJGULA_rGiyk5Pu
        run: |
          respuesta=$(curl -sS --fail-with-body --max-time 30 -X POST "$SUPABASE_URL/rest/v1/rpc/es_autorizado" \
            -H "apikey: $SUPABASE_CLAVE_PUBLICA" -H "Content-Type: application/json" -d '{}')
          echo "Respuesta de la base: $respuesta"
          if [ "$respuesta" != "false" ]; then
            echo "::error::La base no respondió como se esperaba. Revisá el proyecto en supabase.com (¿está pausado?)."
            exit 1
          fi
